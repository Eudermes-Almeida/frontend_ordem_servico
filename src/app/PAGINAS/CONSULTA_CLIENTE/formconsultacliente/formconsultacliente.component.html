
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<div class="d-flex justify-content-center flex-column"> <!-- Adicione flex-column para empilhar os elementos -->
    <form [formGroup]="formulario" id="meuFormulario" class="centralizado-formulario">
        <div class="form-row align-items-center">
            <div class="form-group col-3">
                <div class="d-flex align-items-center">
                    <label for="id">Código Cliente:</label>
                    <span class="espaco"></span> <!-- Espaço de 10 caracteres -->

                    <input 
    type="checkbox" 
    id="buscarUltimoCliente" 
    name="buscarUltimoCliente" 
    class="checkbox" 
    (click)="buscaUltimocliente(codigoClienteInput)">
                    
                    <label for="buscarUltimoCliente">Último Cliente</label>
                </div>
                
                <input 
    type="text" 
    id="codigoCliente" 
    #codigoClienteInput  
    (input)="onClienteInput($event)"
    (keydown)="onClienteKey($event)"
    maxlength="10" 
    class="form-control">
            </div>

            <div class="form-group col-3">
                <label for="nomefantasia">Nome Fantasia:</label>
                <input 
                  type="text" 
                  formControlName="nomefantasia" 
                  id="nomefantasia" 
                  name="nomefantasia" 
                  class="form-control"
                  placeholder="Digite o nome fantasia"
                >
              </div>
              
            
              <div class="form-group col-3">
                <label for="razaosocial">Razao Social:</label>
                <input 
                  type="text" 
                  formControlName="razaosocial" 
                  id="razaosocial" 
                  name="razaosocial" 
                  class="form-control"
                  placeholder="Digite a Razao Social"
                >
              </div>

              <div class="form-group col-3">
                <label for="cidade">Cidade:</label>
                <select id="cidades" name="cidades" (change)="onCityChange($event)" class="form-control">
                  <option *ngFor="let city of cidades" [value]="city.valor">{{ city.valor }}</option>
                </select>
              </div>

              <button style="margin-top: 25px;" class="btn btn-primary" (click)="limpar()">Limpar</button>
              
        </div>
    </form>

    <!-- Adicionando uma margem superior para separar o formulário da tabela -->
<div class="mt-3 tabela-scroll" style="max-height: 300px; overflow-y: auto;"> <!-- Define a altura máxima e ativa a rolagem -->
  <p class="text-secondary" >Quantidade de clientes selecionados: {{objetocliente.length}} </p>  
  <table class="table table-dark table-hover">
        <thead>
            <tr>
                <th>Codigo</th>
                <th>Nome Fantasia</th>
                <th>Razão Social</th>
                <th>Fone</th>
                <th>Celular</th>
                <th>Contato</th>
                <th>Detalhes</th>  
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let cli of objetocliente">
              <td>{{ cli.id }}</td>
              <td>{{ cli.nomefantasia }}</td>
              <td>{{ cli.razaosocial }}</td>
              <td>{{ cli.fonefixo }}</td>
              <td>{{ cli.celular2 }}</td>
              <td>{{ cli.contato }}</td>
              <td>
                <a [routerLink]="['/cliente/altera', cli.id]" routerLinkActive="active">
                  <button type="button" class="btn btn-dark">
                    <i class="bi bi-search" style="font-size: 15px;"></i>
                  </button>
                </a>
                
              </td>
            </tr>
          </tbody>
    </table>
    
</div>

</div>
