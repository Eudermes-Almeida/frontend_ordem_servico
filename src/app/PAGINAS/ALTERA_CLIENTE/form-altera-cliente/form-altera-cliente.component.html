<div class="cc-page">
  <form [formGroup]="formulario" id="meuFormulario" class="cc-shell">

    <!-- HEADER -->
    <div class="cc-header">
      <div class="cc-header-title">
        <span class="cc-header-icon"><i class="bi bi-pencil-square"></i></span>
        <div>
          <h1>Alterar Cliente</h1>
          <p>Atualize os dados do cliente selecionado</p>
        </div>
      </div>
    </div>

    <!-- ALERTA -->
    <div class="cc-alert cc-alert-success" role="alert" *ngIf="exibirAlertClienteSalvo">
      <i class="bi bi-check-circle-fill"></i>
      <span>O Cliente <strong>{{cliente.id}}</strong> foi salvo com sucesso!</span>
      <button type="button" class="cc-alert-close" data-bs-dismiss="alert" aria-label="Close">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>

    <div class="cc-body">

      <!-- SEÇÃO: IDENTIFICAÇÃO -->
      <section class="cc-card">
        <div class="cc-card-title">
          <i class="bi bi-badge-tm"></i> Identificação
        </div>
        <div class="cc-grid">

          <div class="cc-field">
            <label for="id" class="cc-label"><i class="bi bi-lock"></i> Código Cliente</label>
            <input type="text" formControlName="codcli" id="id" name="id" readonly class="cc-input">
          </div>

          <div class="cc-field">
            <label for="nomefantasia" class="cc-label"><i class="bi bi-shop"></i> Nome Fantasia</label>
            <input
              type="text"
              formControlName="nomefantasia"
              id="nomefantasia"
              name="nomefantasia"
              required
              class="cc-input">
            <div *ngIf="formulario.get('nomefantasia')?.invalid && formulario.get('nomefantasia')?.touched" class="cc-error">
              O Nome Fantasia é obrigatório.
            </div>
          </div>

          <div class="cc-field">
            <label for="razaosocial" class="cc-label"><i class="bi bi-building"></i> Razão Social</label>
            <input type="text" formControlName="razaosocial" id="razaosocial" name="razaosocial" class="cc-input">
          </div>

          <div class="cc-field">
            <label for="tipo" class="cc-label"><i class="bi bi-diagram-3"></i> Tipo</label>
            <input type="text" formControlName="tipo" id="tipo" name="tipo" class="cc-input">
          </div>

          <div class="cc-field">
            <label for="cpfcnpj" class="cc-label"><i class="bi bi-credit-card-2-front"></i> Cpf/Cnpj</label>
            <input type="text" formControlName="cpfcnpj" id="cpfcnpj" name="cpfcnpj" class="cc-input">
          </div>

        </div>
      </section>

      <!-- SEÇÃO: ENDEREÇO -->
      <section class="cc-card">
        <div class="cc-card-title">
          <i class="bi bi-geo-alt"></i> Endereço
        </div>
        <div class="cc-grid">

          <div class="cc-field">
            <label for="ruanum" class="cc-label"><i class="bi bi-signpost-split"></i> Rua Nº</label>
            <input type="text" formControlName="ruanum" id="ruanum" name="ruanum" class="cc-input">
          </div>

          <div class="cc-field">
            <label for="num" class="cc-label"><i class="bi bi-hash"></i> Nº</label>
            <input type="text" formControlName="num" id="num" name="num" class="cc-input">
          </div>

          <div class="cc-field">
            <label for="bairro" class="cc-label"><i class="bi bi-pin-map"></i> Bairro</label>
            <input type="text" formControlName="bairro" id="bairro" name="bairro" class="cc-input">
          </div>

          <div class="cc-field">
            <label for="cidade" class="cc-label"><i class="bi bi-buildings"></i> Cidade</label>
            <select id="cidade" name="cidade" (change)="onCityChange($event)" class="cc-input cc-select" formControlName="cidade">
              <option *ngFor="let city of cidades" [value]="city.valor">{{ city.valor }}</option>
            </select>
          </div>

          <div class="cc-field">
            <label for="cep" class="cc-label"><i class="bi bi-mailbox"></i> CEP</label>
            <input type="text" formControlName="cep" id="cep" name="cep" class="cc-input">
          </div>

          <div class="cc-field">
            <label for="fonefixo" class="cc-label"><i class="bi bi-telephone"></i> Fone Fixo</label>
            <input type="text" formControlName="fonefixo" id="fonefixo" name="fonefixo" class="cc-input">
          </div>

        </div>
      </section>

      <!-- SEÇÃO: CONTATO -->
      <section class="cc-card">
        <div class="cc-card-title">
          <i class="bi bi-person-lines-fill"></i> Contato
        </div>
        <div class="cc-grid">

          <div class="cc-field">
            <label for="contato" class="cc-label"><i class="bi bi-person"></i> Contato</label>
            <input type="text" formControlName="contato" id="contato" name="contato" class="cc-input">
          </div>

          <div class="cc-field">
            <label for="fone" class="cc-label"><i class="bi bi-whatsapp"></i> Whatsapp</label>
            <input type="text" formControlName="fone" id="fone" name="fone" class="cc-input">
          </div>

          <div class="cc-field">
            <label for="celular2" class="cc-label"><i class="bi bi-phone"></i> Celular 2</label>
            <input type="text" formControlName="celular2" id="celular2" name="celular2" class="cc-input">
          </div>

          <div class="cc-field">
            <label for="email" class="cc-label"><i class="bi bi-envelope"></i> Email</label>
            <input type="email" formControlName="email" id="email" name="email" class="cc-input">
          </div>

        </div>
      </section>

      <!-- SEÇÃO: OUTRAS INFORMAÇÕES -->
      <section class="cc-card">
        <div class="cc-card-title">
          <i class="bi bi-sliders"></i> Outras Informações
        </div>
        <div class="cc-grid">

          <div class="cc-field">
            <label for="segmento" class="cc-label"><i class="bi bi-tags"></i> Segmento</label>
            <select id="segmento" name="segmento" (change)="onSegmentoChange($event)" class="cc-input cc-select" formControlName="segmento">
              <option *ngFor="let city of segmentos" [value]="city.valor">{{ city.valor }}</option>
            </select>
          </div>

          <div class="cc-field">
            <label for="inscestadual" class="cc-label"><i class="bi bi-file-earmark-text"></i> Inscrição Estadual</label>
            <input type="text" formControlName="inscestadual" id="inscestadual" name="inscestadual" class="cc-input">
          </div>

        </div>
      </section>

    </div>

    <!-- BARRA DE AÇÕES -->
    <div class="cc-actions">
      <a routerLink="/home" routerLinkActive="active">
        <button type="button" class="cc-btn cc-btn-ghost">
          <i class="bi bi-box-arrow-left"></i> Sair
        </button>
      </a>
      <button type="button" class="cc-btn cc-btn-primary" (click)="salvarAlteracoes()">
        <i class="bi bi-check2-circle"></i> Alterar
      </button>
    </div>

  </form>
</div>
