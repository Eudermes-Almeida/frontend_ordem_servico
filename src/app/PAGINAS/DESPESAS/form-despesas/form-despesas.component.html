<div class="d-flex justify-content-center">
    <form [formGroup]="formulario" id="meuFormulario" class="centralizado-formulario">

        <div class="alert alert-warning alert-dismissible fade show" role="alert" *ngIf="exibirAlertClienteSalvo">
            O Cliente <strong>{{cliente.id}}</strong> foi salvo com sucesso!
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>

        <div class="form-row">
            <div class="form-group">
                <label for="id">Código Cliente:</label>
                <input type="text" formControlName="codcli" id="id" name="id" readonly>
            </div>
            
            <div class="form-group">
                <label for="nomefantasia">Nome Fantasia:</label>
                <input 
                    type="text" 
                    formControlName="nomefantasia" 
                    id="nomefantasia" 
                    name="nomefantasia" 
                    required 
                    class="form-control"
                >
            </div>
            <div *ngIf="formulario.get('nomefantasia')?.invalid && formulario.get('nomefantasia')?.touched" class="text-danger">
                O Nome Fantasia é obrigatório.
            </div>
            <div class="form-group">
                <label for="razaosocial">Razão Social:</label>
                <input type="text" formControlName="razaosocial" id="razaosocial" name="razaosocial">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="tipo">Tipo:</label>
                <input type="text" formControlName="tipo" id="tipo" name="tipo">
            </div>
            <div class="form-group">
                <label for="cpfcnpj">Cpf/Cnpj:</label>
                <input type="text" formControlName="cpfcnpj" id="cpfcnpj" name="cpfcnpj">
            </div>
            <div class="form-group">
                <label for="contato">Contato:</label>
                <input type="text" formControlName="contato" id="contato" name="contato">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="ruanum">Rua Nº:</label>
                <input type="text" formControlName="ruanum" id="ruanum" name="ruanum">
            </div>
            <div class="form-group">
                <label for="num">Nº:</label>
                <input type="text" formControlName="num" id="num" name="num">
            </div>
            <div class="form-group">
                <label for="bairro">Bairro:</label>
                <input type="text" formControlName="bairro" id="bairro" name="bairro">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group col-3">
                <label for="cidade">Cidade:</label>
                <select id="cidade" name="cidade" (change)="onCityChange($event)" class="form-control selects" formControlName="cidade">
                  <option *ngFor="let city of cidades" [value]="city.valor">{{ city.valor }}</option>
                </select>
              </div>
            <div class="form-group">
                <label for="cep">CEP:</label>
                <input type="text" formControlName="cep" id="cep" name="cep">
            </div>
            <div class="form-group">
                <label for="fonefixo">Fone Fixo:</label>
                <input type="text" formControlName="fonefixo" id="fonefixo" name="fonefixo">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="fone">Whatsapp:</label>
                <input type="text" formControlName="fone" id="fone" name="fone">
            </div>
            <div class="form-group">
                <label for="celular2">Celular 2:</label>
                <input type="text" formControlName="celular2" id="celular2" name="celular2">
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" formControlName="email" id="email" name="email">
            </div>
        </div>
        <div class="seg-insc-sair-altera d-flex align-items-center">
            <div class="form-group col-3">
                <label for="segmento">Segmento:</label>
                <select id="segmento" name="segmento" (change)="onSegmentoChange($event)" class="form-control selects" formControlName="segmento">
                  <option *ngFor="let city of segmentos" [value]="city.valor">{{ city.valor }}</option>
                </select>
              </div>
            <div class="form-group col me-2"> <!-- Adiciona margem à direita -->
                <label for="inscestadual">Inscrição Estadual:</label>
                <input type="text" formControlName="inscestadual" id="inscestadual" name="inscestadual">
            </div>
            <div class="form-group col-auto submit-group me-2"> <!-- Adiciona margem à direita -->
                <a routerLink="/home" routerLinkActive="active"><button type="button" class="btn btn-primary">SAIR</button></a>  
            </div>
            <div class="form-group col-auto submit-group">
                <button type="button" class="btn btn-primary" (click)="salvarAlteracoes()">ALTERAR</button>  
            </div>
        </div>
    </form>
</div>
