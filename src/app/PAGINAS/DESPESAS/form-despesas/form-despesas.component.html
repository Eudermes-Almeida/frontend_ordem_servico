<div class="d-flex justify-content-center">
   
    <h2 style="color: orange;">CADASTRAR DESPESAS:</h2>

        
    <div>
        <button type="button" style="margin-top: 20px;" class="btn btn-primary" (click)="iniciarMes()">Iniciar Mês</button>
        <button type="button" style="margin-top: 20px;" class="btn btn-primary" (click)="cadastrarDespesasAvulsas()">Cadastrar Despesas Avulsas</button>
        <div class="mb-3" style="max-width: 300px;">
  <label for="dataDespesa" class="form-label">Data da Despesa</label>
  
  <div class="input-group">
  <input
    class="form-control"
    placeholder="yyyy-mm-dd"
    name="dp"
    [(ngModel)]="model"
    ngbDatepicker
    #d="ngbDatepicker"
  />
  <button class="btn btn-outline-primary" (click)="d.toggle()" type="button">
    <i class="bi bi-calendar3"></i> <!-- O ícone oficial do Bootstrap -->
  </button>
</div>

</div>


<!-- Apenas para você ver o valor sendo capturado em tempo real -->
<p style="color: orange;">
  Data selecionada: {{ model?.day }}/{{ model?.month }}/{{ model?.year }}
</p>


    </div>
    
</div>
