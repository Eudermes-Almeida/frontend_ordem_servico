<!-- Título centralizado no topo -->
<div class="text-center mb-4">
  <h2 style="color: orange; margin-bottom: 0;">CADASTRAR DESPESAS:</h2>
</div>

<!-- Container com os controles alinhados abaixo -->
<div class="d-flex justify-content-center align-items-center gap-3 flex-wrap">

  <!-- Container de Datas -->
  <div class="d-flex gap-2">
    <div class="input-group" style="max-width: 250px;">
      <span class="input-group-text">Início</span>
      <input class="form-control" placeholder="aaaa-mm-dd" name="dp" [(ngModel)]="model" ngbDatepicker #d1="ngbDatepicker" (dateSelect)="onDateInicial($event)" />
      <button class="btn btn-outline-primary" (click)="d1.toggle()" type="button">
        <i class="bi bi-calendar3"></i>
      </button>
    </div>

    <div class="input-group" style="max-width: 250px;">
      <span class="input-group-text">Fim</span>
      <input class="form-control" placeholder="aaaa-mm-dd" name="dp2" [(ngModel)]="model2" ngbDatepicker #d2="ngbDatepicker" (dateSelect)="onDateFinal($event)" />
      <button class="btn btn-outline-primary" (click)="d2.toggle()" type="button">
        <i class="bi bi-calendar3"></i>
      </button>
    </div>
  </div>
  
  <!-- Botão 1 -->
  <button type="button" class="btn btn-primary" (click)="buscarInicioMes()">
    Iniciar Mês
  </button>

  <!-- Botão 2 -->
  <button type="button" class="btn btn-primary" (click)="cadastrarDespesasAvulsas()">
    Cadastrar Despesas Avulsas
  </button>

</div>
