
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<div class="d-flex justify-content-center flex-column"> <!-- Adicione flex-column para empilhar os elementos -->
    <form [formGroup]="formulario" id="meuFormulario" class="centralizado-formulario">
        
      <div class="alert alert-warning alert-dismissible fade show" role="alert" *ngIf="exibirTextoOsSalva">
        A ordem de serviço <strong>{{os.os}}</strong> foi salva com sucesso!
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>
      
      <!--<p class="text-secondary" style="text-align: center; font-size: larger;">Escolha o Cliente:</p>-->
        <div class="form-row align-items-center">
            <div class="form-group col-3">
                <div class="d-flex align-items-center">
                    <label for="numOs">Número ordem Serviço:</label>
                    <span class="espaco"></span> <!-- Espaço de 10 caracteres -->
        
                </div>
                
                <input 
        type="text" 
        id="numOs" 
        #numOs 
        formControlName="os" 
        maxlength="10" 
        class="form-control"
        readonly>
            </div>
        
            <div class="form-group col-3">
                <label for="data">Data Entrada:</label>
                <input 
                  type="text" 
                  formControlName="data" 
                  id="data" 
                  name="data" 
                  required 
                  class="form-control"
                  placeholder=""
                  
                >
              </div>
              
            
              <div class="form-group col-3">
                <label for="hora">Hora Entrada:</label>
                <input 
                  type="text" 
                  formControlName="hora" 
                  id="hora" 
                  name="hora" 
                  required 
                  class="form-control"
                  placeholder=""
                  
                >
              </div>
        
              <div class="form-group col-3">
                <label for="status">Status:</label>
                <input 
                  type="text" 
                  formControlName="status" 
                  id="status" 
                  name="status" 
                  required 
                  class="form-control"
                  placeholder=""
                  [readOnly]="true"
                >
              </div>
        <!----------------------------------------------------------------------------------------->     
        </div>
       
        <div class="form-row align-items-center">
            <div class="form-group col-3">
                <div class="d-flex align-items-center">
                    <label for="id">Código Cliente:</label>
                    
                </div>
                
                <input 
    type="text" 
    id="codigoCliente" 
    #codigoClienteInput  
    formControlName="codcli" 
    maxlength="10" 
    class="form-control">
            </div>

            <div class="form-group col-3">
                <label for="nomefantasia">Nome Fantasia:</label>
                <input 
                  type="text" 
                  formControlName="fantasia" 
                  id="nomefantasia" 
                  name="nomefantasia" 
                  required 
                  class="form-control"
                  placeholder="Digite o nome fantasia"
                >
              </div>
              
            
              <div class="form-group col-3">
                <label for="razaosocial">Razao Social:</label>
                <input 
                  type="text" 
                  formControlName="rzsocial" 
                  id="razaosocial" 
                  name="razaosocial" 
                  required 
                  class="form-control"
                  placeholder="Digite a Razao Social"
                >
              </div>

              
              
        </div>
    

    <!-- Adicionando uma margem superior para separar o formulário da tabela -->
<div class="mt-3 tabela-scroll" style="max-height: 300px; overflow-y: auto;"> <!-- Define a altura máxima e ativa a rolagem --> 
  

    <!----------------------------------------------------------------------------------------->

    <div class="form-row align-items-center">
      <div class="form-group col-3">
        <label for="equipamento">Equipamento:</label>
        <select id="equipamentos" name="equipamentos" (change)="onEquipamentoChange($event)" class="form-control" formControlName="equipamento">
          <option *ngFor="let city of equipamentos" [value]="city.valor">{{ city.valor }}</option>
        </select>
      </div>

      <div class="form-group col-3">
        <div class="d-flex align-items-center">
            <label for="marca">Marca:</label>
        </div>
        
        <input 
type="text" 
id="marca" 
#marca 
formControlName="marca"  
class="form-control">
    </div>
      
      <div class="form-group col-3">
        <div class="d-flex align-items-center">
            <label for="modelo">Modelo:</label>
        </div>
        
        <input 
type="text" 
id="modelo" 
#modelo 
formControlName="modelo"  
class="form-control">
    </div>

      <div class="form-group col-3">
        <div class="d-flex align-items-center">
            <label for="topologia">Topologia:</label>
        </div>
        
        <input 
type="text" 
id="topologia" 
#topologia 
formControlName="topologia"  
class="form-control">
    </div>
      
      
      

        <div class="form-group col-3">
          <label for="cor">Cor:</label>
          <select id="cores" name="cores" class="form-control" formControlName="cor">
            <option *ngFor="let city of cores" [value]="city.valor">{{ city.valor }}</option>
          </select>
        </div> 
  </div>

  <!---------------------------------------------------------------------------------------------->

  <div class="form-row align-items-center">
    <div class="form-group col-3">
        <div class="d-flex align-items-center">
            <label for="serial">Serial:</label>
            <span class="espaco"></span> <!-- Espaço de 10 caracteres -->

        </div>
        
        <input 
type="text" 
id="serial" 
#codigoClienteInput 
formControlName="serial" 
maxlength="10" 
class="form-control">
    </div>

    <div class="form-group col-3">
        <label for="patrimonio">Patrimonio:</label>
        <input 
          type="text" 
          formControlName="patrimonio" 
          id="patrimonio" 
          name="patrimonio" 
          required 
          class="form-control"
          placeholder="Digite o patrimonio"
        >
      </div>
      
    
      <div class="form-group col-3">
        <label for="observacao1">Observacão1:</label>
        <input 
          type="text" 
          formControlName="obs1" 
          id="obs1" 
          name="obs1" 
          required 
          class="form-control"
          placeholder="Digite a observação 1"
        >
      </div>

      <div class="form-group col-3">
        <label for="observacao2">Observacão2:</label>
        <input 
          type="text" 
          formControlName="obs2" 
          id="obs2" 
          name="obs2" 
          required 
          class="form-control"
          placeholder="Digite a observação 2"
        >
      </div>
      
</div>

<!------------------------------------------------------------------------------------------------>

<div class="form-row align-items-center">
  <div class="form-group col-3">
    <label for="defeito1">Defeito 1:</label>
    <select id="defeitos" name="defeitos" (change)="onDefeitoCliente1Change($event)" class="form-control" formControlName="defeito1">
      <option *ngFor="let city of defeitosCliente" [value]="city.valor">{{ city.valor }}</option>
    </select>
  </div>

  <div class="form-group col-3">
    <label for="defeito2">Defeito 2:</label>
    <select id="defeitos" name="defeitos" (change)="onDefeitoCliente2Change($event)" class="form-control" formControlName="defeito2">
      <option *ngFor="let city of defeitosCliente" [value]="city.valor">{{ city.valor }}</option>
    </select>
    </div>
    
  
    <div class="form-group col-3; menor">
      <label for="venda">Venda:</label>
      <select id="venda" name="venda" (change)="onVendaChange($event)" class="form-control" formControlName="venda">
        <option> </option>
        <option>NÃO</option>
        <option>NOVO</option>
        <option>SEMI-NOVO</option>
      </select>
    </div>

    <div class="form-group col-3">
      <label for="garantia">Garantia:</label>
      <select id="garantia" name="garantia" (change)="onGarantiaChange($event)" class="form-control" formControlName="garantia">
        <option> </option>
        <option>NÃO</option>
        <option>LOJA</option>
        <option>FABRICA</option>
      </select>
    </div>

    <div class="form-group col-3">
      <label for="osoriginal">Os original:</label>
      <input 
        type="text" 
        formControlName="osoriginal" 
        id="osoriginal" 
        name="osoriginal" 
        required 
        class="form-control"
        placeholder="Digite a os original"
      >
    </div>

    <div class="form-group col-3">
      <label for="atendente">Atendente:</label>
      <select (change)="onAtendenteChange($event)" class="form-control" formControlName="atendente">
        <option *ngFor="let city of atendentes" [value]="city.valor">{{ city.valor }}</option>
      </select>
    </div>

</div>

<div class="btn-salvar-ordem-servico">
<a routerLink="/home" routerLinkActive="active"><button type="button" class="btn btn-primary" *ngIf="exibirBotaoSair">SAIR</button></a> 

<a><button class="btn btn-primary m-2"  *ngIf="exibirBotaoSalvar" [routerLink]="['/os/consulta/alterapg2', os.os]">Pagina 2</button></a>
<button class="btn btn-primary m-2" *ngIf="exibirBotaoSalvar" (click)="atualizarOS()">Salvar</button>
<p style="color: orange;" *ngIf="exibirTextoOsSalva">Ordem de serviço salva!</p>
</div>  

</div>
</form>
</div>
