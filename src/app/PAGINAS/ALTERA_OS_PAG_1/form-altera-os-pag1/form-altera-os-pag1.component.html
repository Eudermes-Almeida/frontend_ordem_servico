<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<div class="cc-page">
  <form [formGroup]="formulario" id="meuFormulario" class="cc-shell">

    <!-- HEADER -->
    <div class="cc-header">
      <div class="cc-header-title">
        <span class="cc-header-icon"><i class="bi bi-file-earmark-text"></i></span>
        <div>
          <h1>Alterar Ordem de Serviço</h1>
          <p>Página 1 — Dados gerais, cliente e equipamento</p>
        </div>
      </div>
    </div>

    <!-- ALERTA -->
    <div class="cc-alert cc-alert-success" role="alert" *ngIf="exibirTextoOsSalva">
      <i class="bi bi-check-circle-fill"></i>
      <span>A ordem de serviço <strong>{{os.os}}</strong> foi salva com sucesso!</span>
      <button type="button" class="cc-alert-close" data-bs-dismiss="alert" aria-label="Close">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>

    <div class="cc-body">

      <!-- SEÇÃO: DADOS DA OS -->
      <section class="cc-card">
        <div class="cc-card-title">
          <i class="bi bi-clipboard2-data"></i> Dados da Ordem de Serviço
        </div>
        <div class="cc-grid">

          <div class="cc-field">
            <label for="numOs" class="cc-label"><i class="bi bi-lock"></i> Número Ordem Serviço</label>
            <input type="text" id="numOs" #numOs formControlName="os" maxlength="10" class="cc-input" readonly>
          </div>

          <div class="cc-field">
            <label for="data" class="cc-label"><i class="bi bi-calendar-event"></i> Data Entrada</label>
            <input type="text" formControlName="data" id="data" name="data" required class="cc-input">
          </div>

          <div class="cc-field">
            <label for="hora" class="cc-label"><i class="bi bi-clock"></i> Hora Entrada</label>
            <input type="text" formControlName="hora" id="hora" name="hora" required class="cc-input">
          </div>

          <div class="cc-field">
            <label for="status" class="cc-label"><i class="bi bi-lock"></i> Status</label>
            <input type="text" formControlName="status" id="status" name="status" required class="cc-input"
              [readOnly]="true">
          </div>

        </div>
      </section>

      <!-- SEÇÃO: CLIENTE -->
      <section class="cc-card">
        <div class="cc-card-title">
          <i class="bi bi-person-lines-fill"></i> Cliente
        </div>
        <div class="cc-grid">

          <div class="cc-field">
            <label for="codigoCliente" class="cc-label"><i class="bi bi-hash"></i> Código Cliente</label>
            <input type="text" id="codigoCliente" #codigoClienteInput formControlName="codcli" maxlength="10"
              class="cc-input">
          </div>

          <div class="cc-field">
            <label for="nomefantasia" class="cc-label"><i class="bi bi-shop"></i> Nome Fantasia</label>
            <input type="text" formControlName="fantasia" id="nomefantasia" name="nomefantasia" required
              class="cc-input" placeholder="Digite o nome fantasia">
          </div>

          <div class="cc-field">
            <label for="razaosocial" class="cc-label"><i class="bi bi-building"></i> Razão Social</label>
            <input type="text" formControlName="rzsocial" id="razaosocial" name="razaosocial" required
              class="cc-input" placeholder="Digite a Razão Social">
          </div>

        </div>
      </section>

      <!-- SEÇÃO: EQUIPAMENTO -->
      <section class="cc-card">
        <div class="cc-card-title">
          <i class="bi bi-hdd-stack"></i> Equipamento
        </div>
        <div class="cc-grid">

          <div class="cc-field">
            <label for="equipamentos" class="cc-label"><i class="bi bi-pc-display"></i> Equipamento</label>
            <select id="equipamentos" name="equipamentos" (change)="onEquipamentoChange($event)"
              class="cc-input cc-select" formControlName="equipamento">
              <option *ngFor="let city of equipamentos" [value]="city.valor">{{ city.valor }}</option>
            </select>
          </div>

          <div class="cc-field">
            <label for="marca" class="cc-label"><i class="bi bi-tag"></i> Marca</label>
            <input type="text" id="marca" #marca formControlName="marca" class="cc-input">
          </div>

          <div class="cc-field">
            <label for="modelo" class="cc-label"><i class="bi bi-upc-scan"></i> Modelo</label>
            <input type="text" id="modelo" #modelo formControlName="modelo" class="cc-input">
          </div>

          <div class="cc-field">
            <label for="topologia" class="cc-label"><i class="bi bi-diagram-3"></i> Topologia</label>
            <input type="text" id="topologia" #topologia formControlName="topologia" class="cc-input">
          </div>

          <div class="cc-field">
            <label for="cores" class="cc-label"><i class="bi bi-palette"></i> Cor</label>
            <select id="cores" name="cores" class="cc-input cc-select" formControlName="cor">
              <option *ngFor="let city of cores" [value]="city.valor">{{ city.valor }}</option>
            </select>
          </div>

        </div>
      </section>

      <!-- SEÇÃO: DETALHES DO EQUIPAMENTO -->
      <section class="cc-card">
        <div class="cc-card-title">
          <i class="bi bi-card-checklist"></i> Detalhes do Equipamento
        </div>
        <div class="cc-grid">

          <div class="cc-field">
            <label for="serial" class="cc-label"><i class="bi bi-upc"></i> Serial</label>
            <input type="text" id="serial" formControlName="serial" maxlength="30" class="cc-input">
          </div>

          <div class="cc-field">
            <label for="patrimonio" class="cc-label"><i class="bi bi-bookmark"></i> Patrimônio</label>
            <input type="text" formControlName="patrimonio" id="patrimonio" name="patrimonio" required
              class="cc-input" placeholder="Digite o patrimônio">
          </div>

          <div class="cc-field">
            <label for="obs1" class="cc-label"><i class="bi bi-chat-left-text"></i> Observação 1</label>
            <input type="text" formControlName="obs1" id="obs1" name="obs1" required class="cc-input"
              placeholder="Digite a observação 1">
          </div>

          <div class="cc-field">
            <label for="obs2" class="cc-label"><i class="bi bi-chat-left-text"></i> Observação 2</label>
            <input type="text" formControlName="obs2" id="obs2" name="obs2" required class="cc-input"
              placeholder="Digite a observação 2">
          </div>

        </div>
      </section>

      <!-- SEÇÃO: DIAGNÓSTICO E ATENDIMENTO -->
      <section class="cc-card">
        <div class="cc-card-title">
          <i class="bi bi-clipboard2-pulse"></i> Diagnóstico e Atendimento
        </div>
        <div class="cc-grid">

          <div class="cc-field">
            <label for="defeito1" class="cc-label"><i class="bi bi-exclamation-circle"></i> Defeito 1</label>
            <select id="defeito1" name="defeito1" (change)="onDefeitoCliente1Change($event)"
              class="cc-input cc-select" formControlName="defeito1">
              <option *ngFor="let city of defeitosCliente" [value]="city.valor">{{ city.valor }}</option>
            </select>
          </div>

          <div class="cc-field">
            <label for="defeito2" class="cc-label"><i class="bi bi-exclamation-circle"></i> Defeito 2</label>
            <select id="defeito2" name="defeito2" (change)="onDefeitoCliente2Change($event)"
              class="cc-input cc-select" formControlName="defeito2">
              <option *ngFor="let city of defeitosCliente" [value]="city.valor">{{ city.valor }}</option>
            </select>
          </div>

          <div class="cc-field">
            <label for="venda" class="cc-label"><i class="bi bi-cart"></i> Venda</label>
            <select id="venda" name="venda" (change)="onVendaChange($event)" class="cc-input cc-select"
              formControlName="venda">
              <option> </option>
              <option>NÃO</option>
              <option>NOVO</option>
              <option>SEMI-NOVO</option>
            </select>
          </div>

          <div class="cc-field">
            <label for="garantia" class="cc-label"><i class="bi bi-shield-check"></i> Garantia</label>
            <select id="garantia" name="garantia" (change)="onGarantiaChange($event)" class="cc-input cc-select"
              formControlName="garantia">
              <option> </option>
              <option>NÃO</option>
              <option>LOJA</option>
              <option>FABRICA</option>
            </select>
          </div>

          <div class="cc-field">
            <label for="osoriginal" class="cc-label"><i class="bi bi-file-earmark-text"></i> Os Original</label>
            <input type="text" formControlName="osoriginal" id="osoriginal" name="osoriginal" required
              class="cc-input" placeholder="Digite a os original">
          </div>

          <div class="cc-field">
            <label for="atendente" class="cc-label"><i class="bi bi-person-badge"></i> Atendente</label>
            <select (change)="onAtendenteChange($event)" id="atendente" class="cc-input cc-select"
              formControlName="atendente">
              <option *ngFor="let city of atendentes" [value]="city.valor">{{ city.valor }}</option>
            </select>
          </div>

        </div>
      </section>

    </div>

    <!-- BARRA DE AÇÕES -->
    <div class="cc-actions">
      <span class="cc-badge cc-badge-success" *ngIf="exibirTextoOsSalva">
        <i class="bi bi-check-circle"></i> Ordem de serviço salva!
      </span>
      <a routerLink="/home" routerLinkActive="active" *ngIf="exibirBotaoSair">
        <button type="button" class="cc-btn cc-btn-ghost">
          <i class="bi bi-box-arrow-left"></i> Sair
        </button>
      </a>
      <a *ngIf="exibirBotaoSalvar" [routerLink]="['/os/consulta/alterapg2', os.os]">
        <button type="button" class="cc-btn cc-btn-ghost">
          <i class="bi bi-arrow-right-circle"></i> Página 2
        </button>
      </a>
      <button type="button" class="cc-btn cc-btn-primary" *ngIf="exibirBotaoSalvar" (click)="atualizarOS()">
        <i class="bi bi-check2-circle"></i> Salvar
      </button>
    </div>

  </form>
</div>
